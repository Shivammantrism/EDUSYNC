crons:
  - name: fee-reminders
    description: "Daily overdue fee reminder — texts parents whose child's fee is past due"
    cron: "30 9 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/fee-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
