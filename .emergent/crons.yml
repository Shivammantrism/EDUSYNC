crons:
  - name: fee-reminders
    description: "Daily overdue fee reminder — texts parents whose child's fee is past due"
    cron: "30 9 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/fee-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: monthly-class-fees
    description: "Auto-generates each class's monthly fee for every enrolled student on the 1st"
    cron: "0 2 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/generate-monthly-fees"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
